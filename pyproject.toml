[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "refract-agent"
version = "0.2.0"
description = "Refract: a traceable LLM agent that turns a news event into a grounded, personalised insight for a specific business or person"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Daniel", email = "danilgreencat@gmail.com" }]
keywords = [
  "llm-agent",
  "news-analytics",
  "grounding",
  "provenance",
  "self-verification",
  "personalization",
  "rag",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Russian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pydantic>=2.7",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2"]
pdf = ["pypdf>=4.0"]
all = ["refract-agent[api,mcp,pdf]"]

[project.scripts]
refract = "refract.cli:main"

[project.urls]
Homepage = "https://github.com/Rinneway/refract"
Documentation = "https://github.com/Rinneway/refract/tree/main/docs"
Issues = "https://github.com/Rinneway/refract/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "mcp>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/refract"]

[tool.hatch.build.targets.wheel.force-include]
"examples/demo" = "refract/demo_data"  # so `refract demo` works after `pip install`

[tool.hatch.build.targets.sdist]
include = ["src/refract", "examples", "docs", "tests", "README.md", "README.ru.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # long prompt strings are intentional
  "RUF001",  # Cyrillic letters and typographic quotes in strings are intentional
  "RUF002",
  "RUF003",
  "B008",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
