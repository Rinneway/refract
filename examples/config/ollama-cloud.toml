# Ollama Cloud: the models of the original experiments without a GPU.
#
# Since 31 Aug 2026 Ollama Cloud bills usage in credits. The Free plan includes starter credits for a small set of
# starter models only; other models answer HTTP 402 ("Add usage credits") until credits or a plan are added. Check
# which models your account may use on ollama.com before a run, and replace the ids below if needed.
#
#   1. sign up at ollama.com → Settings → Keys → create a key
#   2. .env:  OLLAMA_API_KEY=<the key>   (LLM_API_KEY stays for the local server)
#   3. refract --config examples/config/ollama-cloud.toml check
#
# The key is read from OLLAMA_API_KEY, so the same .env serves local runs and, with --config, cloud runs — for
# example an evaluation judged by cloud models:  refract --config examples/config/ollama-cloud.toml eval judge …
# REFRACT_MODEL / REFRACT_VERIFIER_MODEL in the environment override the models below: clear them for cloud runs.
#
# The Free plan runs one request at a time: use `--workers 1` for experiments.

language = "ru"
data_dir = "examples/demo"

[llm]
base_urls = ["https://ollama.com/v1"]
api_key_env = "OLLAMA_API_KEY"
currency = "USD"
timeout_s = 300
timeout_scale = 2

# Model names as listed by https://ollama.com/api/tags (checked 2026-10-31).
[models.main]
id = "glm-5.3-flash"
extra_body = { reasoning_effort = "none" }

[models.verifier]
id = "deepseek-v4.1-flash"
extra_body = { reasoning_effort = "none" }

[models.judge2]
id = "gemma4:31b"
extra_body = { reasoning_effort = "none" }

[institution]
name = "Demo Bank"
name_ru = "Демо-банк"
name_gen = "Демо-банка"
