<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refract</title>
<style>
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #1c2430;
  --muted: #5b6675;
  --rule: #d5dbe2;
  --soft: #f5f7f9;
  --fact: #2f6fb0;
  --house_view: #7a4fb5;
  --ai: #1e8a6e;
  --hypothesis: #b8730f;
  --alert: #a33a2c;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--fact); }
:focus-visible { outline: 2px solid var(--fact); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* top bar: the subject is the context of everything below */
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 24px;
  background: var(--panel); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 17px; letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
.prism { width: 22px; height: 16px; display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 2px; overflow: hidden; }
.prism i:nth-child(1) { background: var(--fact); } .prism i:nth-child(2) { background: var(--house_view); }
.prism i:nth-child(3) { background: var(--ai); } .prism i:nth-child(4) { background: var(--hypothesis); }
.subject { display: flex; align-items: center; gap: 10px; flex: 1 1 360px; min-width: 0; }
.subject select[hidden] { display: none; }
.subject select { max-width: 100%; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
.subject p { margin: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.notice { margin: 0; padding: 8px 24px; font-size: 13px; background: #fbf3e6; color: #6b4708; border-bottom: 1px solid #ecd9b8; }
.notice[hidden] { display: none; }

main { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 0; min-height: calc(100vh - 62px); }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }

/* left: the subject's feed */
aside { border-right: 1px solid var(--rule); padding: 18px 16px 24px 24px; }
@media (max-width: 860px) { aside { border-right: 0; border-bottom: 1px solid var(--rule); padding: 16px; } }
aside h2 { font-size: 15px; margin: 0 0 4px; }
aside .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li + li { margin-top: 6px; }
.item { width: 100%; text-align: left; border: 1px solid transparent; border-radius: 8px; background: transparent;
  padding: 9px 10px 10px; cursor: pointer; display: grid; gap: 3px; }
.item:hover { background: var(--panel); border-color: var(--rule); }
.item[aria-current="true"] { background: var(--panel); border-color: var(--ink); }
.item b { font-weight: 600; line-height: 1.35; }
.item .why { color: var(--muted); font-size: 13px; line-height: 1.4; }
.item .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 2px 12px; flex-wrap: wrap; margin-top: 2px; }
.rel { font-weight: 600; }
.rel.direct { color: var(--ink); }
.rel.background { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
details.paste { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 12px; }
details.paste summary { cursor: pointer; font-weight: 600; }
.paste form { display: grid; gap: 8px; margin-top: 10px; }
.paste input, .paste textarea { width: 100%; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; background: var(--panel); }
.paste textarea { min-height: 120px; resize: vertical; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 6px; padding: 7px 14px; cursor: pointer; justify-self: start; }
.btn.quiet { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }

/* right: reading pane */
section.read { padding: 26px clamp(16px, 4vw, 48px) 48px; min-width: 0; }
.sheet { max-width: 760px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 28px clamp(18px, 3.5vw, 40px) 32px; }
.welcome h1 { font: 600 24px/1.25 var(--serif); margin: 0 0 10px; }
.welcome p { color: var(--muted); margin: 0 0 10px; max-width: 62ch; }

.steps { list-style: none; margin: 16px 0 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 5px 0; color: var(--muted); }
.steps li::before { content: counter(s); font-size: 12px; text-align: right; padding-top: 1px; }
.steps li.running { color: var(--ink); font-weight: 600; }
.steps li.done { color: var(--ink); }
.steps li.failed { color: var(--alert); }
.steps li.running span::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%;
  background: var(--ai); vertical-align: middle; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .steps li.running span::after { animation: none; } }

.headline { font: 600 clamp(21px, 2.4vw, 27px)/1.25 var(--serif); margin: 0 0 12px; }
.impact { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.impact strong { color: var(--ink); font-weight: 600; }

/* the memorable thing: where each statement comes from */
.spectrum { margin: 0 0 26px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--soft); }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.block { margin-top: 24px; }
.block h2 { font-size: 13.5px; font-weight: 650; margin: 0 0 8px; color: var(--muted); letter-spacing: .01em; }
.claims { list-style: none; margin: 0; padding: 0; }
.claim { position: relative; padding: 2px 0 2px 16px; margin: 0 0 12px; font: 16.5px/1.62 var(--serif); }
.claim::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--c, var(--rule)); }
.claim .tag { font: 12.5px/1.4 var(--sans); color: var(--c); font-weight: 600; margin-right: 6px; white-space: nowrap; }
.claim .refs { font: 12px/1 var(--sans); color: var(--muted); margin-left: 4px; white-space: nowrap; }
.claim .refs a { text-decoration: none; color: var(--muted); }
.claim .refs a:hover { color: var(--fact); text-decoration: underline; }
.claim .caveat { display: block; font: 13.5px/1.45 var(--sans); color: var(--muted); margin-top: 2px; }
.claim .effect { display: block; font: 13px/1.4 var(--sans); color: var(--muted); margin-top: 2px; }
.actions { margin: 0; padding-left: 20px; }
.actions li { margin-bottom: 10px; font: 16px/1.55 var(--serif); }
.actions small { display: block; font: 13px/1.45 var(--sans); color: var(--muted); }
.scen { margin: 0; padding-left: 20px; font: 15.5px/1.55 var(--serif); }
.sources { margin: 0; padding-left: 22px; font-size: 13.5px; color: var(--muted); }
.sources li { margin-bottom: 4px; }
.sources li:target { color: var(--ink); background: var(--soft); }
.disclaimer { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--muted); }

.chat { margin-top: 30px; border-top: 1px solid var(--rule); padding-top: 18px; }
.chat h2 { font-size: 15px; margin: 0 0 10px; }
.chat form { display: flex; gap: 8px; }
.chat input { flex: 1; min-width: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.turn { margin: 16px 0 0; }
.turn .q { font-weight: 600; margin: 0 0 6px; }
.turn .a { font: 16px/1.6 var(--serif); margin: 0 0 8px; }
.follow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.follow button { border: 1px solid var(--rule); background: var(--soft); border-radius: 14px; padding: 3px 11px; font-size: 13px; cursor: pointer; }

details.trace { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 14px; }
details.trace summary { cursor: pointer; font-weight: 600; }
.totals { color: var(--muted); font-size: 13px; margin: 8px 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); }
td.num { text-align: right; white-space: nowrap; }
.v-issues { color: var(--hypothesis); } .v-failed { color: var(--alert); }

.error { border-left: 3px solid var(--alert); padding: 6px 0 6px 12px; margin: 14px 0 0; }
.error p { margin: 0 0 4px; }
.signin { border-left: 3px solid var(--rule); padding: 6px 0 6px 12px; margin: 0; }
.signin p { margin: 0 0 4px; }
.token { display: flex; gap: 8px; margin-top: 10px; }
.token input { flex: 1; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="prism" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Refract</div>
  <div class="subject">
    <label class="sr" for="subject" data-t="subject"></label>
    <select id="subject" hidden></select>
    <p id="summary"></p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button>
  </div>
</header>
<p class="notice" id="notice" hidden></p>
<main>
  <aside>
    <h2 data-t="feedTitle"></h2>
    <p class="hint" data-t="feedHint"></p>
    <ul class="feed" id="feed"></ul>
    <details class="paste">
      <summary data-t="pasteTitle"></summary>
      <form id="paste">
        <label class="sr" for="ptitle" data-t="pasteHeadline"></label>
        <input id="ptitle" required minlength="3" maxlength="300" data-ph="pasteHeadline">
        <label class="sr" for="ptext" data-t="pasteText"></label>
        <textarea id="ptext" required minlength="20" data-ph="pasteText"></textarea>
        <button class="btn" type="submit" data-t="pasteGo"></button>
      </form>
    </details>
  </aside>
  <section class="read" aria-live="polite">
    <div class="sheet" id="sheet"></div>
  </section>
</main>
<script>
"use strict";
const T = {
  ru: {
    subject: "Субъект", feedTitle: "Новости для этого субъекта", feedHint: "Отобраны кодом по связям с профилем: деятельность, контрагенты, страны, чувствительности. Нажмите на новость, чтобы агент её разобрал.",
    pasteTitle: "Разобрать свою новость", pasteHeadline: "Заголовок", pasteText: "Текст новости", pasteGo: "Разобрать",
    direct: "касается напрямую", background: "фон", none: "не касается", ceiling: "потолок влияния",
    welcomeTitle: "Что новость значит именно для вас", welcome1: "Выберите субъект — компанию, ИП, самозанятого или частное лицо — и новость слева. Агент найдёт связь события с профилем, проверит каждое утверждение по источникам и покажет, откуда оно взялось.",
    welcome2: "Цвет полосы у каждого утверждения — его происхождение.",
    working: "Агент разбирает новость", noFeed: "Ни одна сохранённая новость не связана с этим субъектом.",
    impact: "Влияние", levels: { low: "низкое", medium: "среднее", high: "высокое" },
    direction: { negative: "негативно", positive: "позитивно", mixed: "неоднозначно", unclear: "неясно" },
    horizon: { immediate: "до месяца", short: "1–3 месяца", medium: "3–12 месяцев", long: "больше года" },
    origin: { fact: "факт", house_view: "позиция {inst}", ai: "вывод AI", hypothesis: "гипотеза" },
    blocks: { what_happened: "Что произошло", why_it_matters: "Почему это важно для вас", risks: "Риски", opportunities: "Возможности",
      house_view: "Позиция {inst}", scenarios: "Сценарии", actions: "Что можно сделать", sources: "Источники" },
    noHouse: "По этой теме у {inst} пока нет позиции.",
    kinds: { analysis: "анализ", operational: "операционное решение", financial: "финансовое решение", contact_manager: "связаться с менеджером",
      request_callback: "обратный звонок", apply_product: "продукт" },
    because: "Почему вам", relies: "опирается на", product: "продукт", plausibility: "вероятность",
    caveatLabel: "Оговорка", estimate: "оценка",
    askTitle: "Спросить об этой новости", ask: "Спросить", askPh: "Например: что это значит для наших кредитов?",
    trace: "Как получен вывод", step: "Шаг", model: "Модель", time: "Время", verdict: "Итог", notes: "Замечания",
    totals: "вызовов модели: {c}, из кэша: {k}, токенов: {t}, время: {s} с, ревизий: {r}",
    failed: "Агент не дал инсайт", noModel: "Модель не настроена: разбор новостей недоступен, лента ранжирует только размеченные новости. Задайте LLM_API_KEY и модель в .env или refract.toml и перезапустите refract serve.",
    dataProblems: "Пропущены файлы данных: ", tokenNeeded: "API закрыт токеном. Введите REFRACT_API_TOKEN:", tokenGo: "Войти",
    netError: "Сервер не ответил. Проверьте, что refract serve запущен.", sourceTypes: { news: "новость", research: "аналитика", profile: "данные субъекта", payments: "платежи", public_stats: "статистика", user_input: "введено вручную" },
  },
  en: {
    subject: "Subject", feedTitle: "News for this subject", feedHint: "Picked by code from links to the profile: activity, counterparties, countries, sensitivities. Click an item and the agent will explain it.",
    pasteTitle: "Explain your own news", pasteHeadline: "Headline", pasteText: "News text", pasteGo: "Explain",
    direct: "concerns you directly", background: "background", none: "unrelated", ceiling: "impact ceiling",
    welcomeTitle: "What the news means for you", welcome1: "Choose a subject — a company, a sole proprietor, a self-employed person or a household — and a news item on the left. The agent links the event to the profile, checks every statement against its sources and shows where each one comes from.",
    welcome2: "The colour of each statement's bar is its origin.",
    working: "The agent is working on it", noFeed: "None of the stored news is linked to this subject.",
    impact: "Impact", levels: { low: "low", medium: "medium", high: "high" },
    direction: { negative: "negative", positive: "positive", mixed: "mixed", unclear: "unclear" },
    horizon: { immediate: "within a month", short: "1–3 months", medium: "3–12 months", long: "over a year" },
    origin: { fact: "fact", house_view: "{inst} view", ai: "AI inference", hypothesis: "hypothesis" },
    blocks: { what_happened: "What happened", why_it_matters: "Why it matters to you", risks: "Risks", opportunities: "Opportunities",
      house_view: "{inst} view", scenarios: "Scenarios", actions: "What you can do", sources: "Sources" },
    noHouse: "{inst} has no published view on this topic yet.",
    kinds: { analysis: "analysis", operational: "operational step", financial: "financial step", contact_manager: "talk to your manager",
      request_callback: "request a callback", apply_product: "product" },
    because: "Why you", relies: "rests on", product: "product", plausibility: "plausibility",
    caveatLabel: "Caveat", estimate: "estimate",
    askTitle: "Ask about this news", ask: "Ask", askPh: "For example: what does it mean for our loans?",
    trace: "How this was produced", step: "Step", model: "Model", time: "Time", verdict: "Result", notes: "Notes",
    totals: "model calls: {c}, cached: {k}, tokens: {t}, time: {s} s, revisions: {r}",
    failed: "The agent produced no insight", noModel: "No model is configured: explaining news is unavailable, and the feed ranks only tagged news. Set LLM_API_KEY and a model in .env or refract.toml and restart refract serve.",
    dataProblems: "Skipped data files: ", tokenNeeded: "The API is protected by a token. Enter REFRACT_API_TOKEN:", tokenGo: "Sign in",
    netError: "The server did not answer. Check that refract serve is running.", sourceTypes: { news: "news", research: "research", profile: "subject data", payments: "payments", public_stats: "statistics", user_input: "entered by hand" },
  },
};
const ORIGINS = ["fact", "house_view", "ai", "hypothesis"];
const ROLE = { company: "cfo", sole_proprietor: "entrepreneur", self_employed: "entrepreneur", individual: "individual" };
const S = { lang: "ru", health: null, profiles: [], profile: null, feed: [], event: null, insight: null, trace: null, history: [], token: null, poll: null };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const t = (k) => T[S.lang][k];
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
const inst = () => (S.health && S.health.institution && S.health.institution[S.lang]) || (S.lang === "ru" ? "института" : "the institution");
function store(key, value) { try { value == null ? sessionStorage.removeItem(key) : sessionStorage.setItem(key, value); } catch (e) { /* storage may be off */ } }
function recall(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }

class ApiError extends Error { constructor(status, detail) { super(detail); this.status = status; } }
async function api(path, options = {}) {
  const headers = { "content-type": "application/json", ...(S.token ? { authorization: `Bearer ${S.token}` } : {}) };
  let res;
  try { res = await fetch(path, { ...options, headers }); } catch (e) { throw new ApiError(0, t("netError")); }
  if (!res.ok) {
    let detail = res.statusText;
    try { const body = await res.json(); detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail); } catch (e) { /* not JSON */ }
    throw new ApiError(res.status, detail);
  }
  return res.headers.get("content-type")?.includes("json") ? res.json() : res.text();
}

function setLang(lang) {
  S.lang = lang === "en" ? "en" : "ru";
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-ph]").forEach((el) => { el.placeholder = t(el.dataset.ph); });
  store("refract.lang", S.lang);
}

function notice() {
  const h = S.health, out = [];
  if (h && !h.llm_configured) out.push(t("noModel"));
  if (h && h.data_problems && h.data_problems.length) out.push(t("dataProblems") + h.data_problems.join("; "));
  $("notice").hidden = !out.length;
  $("notice").textContent = out.join(" ");
}

function showError(err) {
  if (err.status === 401) {
    $("sheet").innerHTML = `<form class="signin" id="tokenForm"><p>${esc(t("tokenNeeded"))}</p><div class="token">
      <input id="tokenInput" type="password" autocomplete="off" required><button class="btn" type="submit">${esc(t("tokenGo"))}</button></div></form>`;
    $("tokenForm").onsubmit = (e) => { e.preventDefault(); S.token = $("tokenInput").value.trim(); store("refract.token", S.token); start(); };
    $("tokenInput").focus();
    return;
  }
  $("sheet").innerHTML = `<div class="error" role="alert"><p><strong>${esc(err.status === 502 ? t("failed") : "Error " + (err.status || ""))}</strong></p><p>${esc(err.message)}</p></div>`;
}

function welcome() {
  $("sheet").innerHTML = `<div class="welcome"><h1>${esc(t("welcomeTitle"))}</h1><p>${esc(t("welcome1"))}</p><p>${esc(t("welcome2"))}</p>${legend(null)}</div>`;
}

// ---------------------------------------------------------------- subject and feed

function renderProfiles() {
  const sel = $("subject");
  sel.hidden = !S.profiles.length;
  sel.innerHTML = S.profiles.map((p) => `<option value="${esc(p.profile_id)}">${esc(p.name || p.profile_id)}</option>`).join("");
  if (S.profile) sel.value = S.profile.profile_id;
}

async function chooseProfile(id) {
  S.profile = S.profiles.find((p) => p.profile_id === id) || S.profiles[0];
  if (!S.profile) return;
  store("refract.profile", S.profile.profile_id);
  $("summary").textContent = S.profile.summary || "";
  $("summary").title = S.profile.summary || "";
  S.event = null; S.insight = null; S.history = [];
  welcome();
  $("feed").innerHTML = "";
  try {
    const tag = S.health && S.health.llm_configured ? "true" : "false";
    const feed = await api(`/profiles/${encodeURIComponent(S.profile.profile_id)}/feed?top=30&tag=${tag}&language=${S.lang}`);
    S.feed = feed.items;
    renderFeed();
  } catch (e) { showError(e); }
}

function renderFeed() {
  const fmt = new Intl.DateTimeFormat(S.lang, { day: "numeric", month: "short" });
  if (!S.feed.length) { $("feed").innerHTML = `<li class="empty">${esc(t("noFeed"))}</li>`; return; }
  $("feed").innerHTML = S.feed.map((it, i) => {
    // the strongest link without its strength word (shown as relevance) and the factor key (for experts, in the trace)
    const reason = (it.links[0] || "").replace(/^[^—]*—\s*/, "").replace(/\s\([\w:.]+\)$/, "");
    return `<li><button class="item" type="button" data-i="${i}" aria-current="${S.event === it.event_id}">
      <b>${esc(it.title)}</b>
      <span class="why">${esc(reason)}</span>
      <span class="meta"><span class="rel ${it.relevance}">${esc(t(it.relevance))}</span><span>${esc(t("ceiling"))}: ${esc(t("levels")[it.impact_ceiling])}</span><span>${esc(fmt.format(new Date(it.published_at)))}</span></span>
    </button></li>`;
  }).join("");
  $("feed").querySelectorAll(".item").forEach((b) => { b.onclick = () => analyze({ event_id: S.feed[+b.dataset.i].event_id }); });
}

// ---------------------------------------------------------------- running the agent

async function analyze(target) {
  if (!S.profile) return;
  clearInterval(S.poll);
  S.event = target.event_id || null; S.insight = null; S.history = [];
  renderFeed();
  $("sheet").innerHTML = `<h1 class="headline">${esc(t("working"))}</h1><ol class="steps" id="steps"></ol>`;
  const body = { profile_id: S.profile.profile_id, role: ROLE[S.profile.kind] || "other", language: S.lang, ...target };
  let job;
  try { job = await api("/insights", { method: "POST", body: JSON.stringify(body) }); } catch (e) { showError(e); return; }
  const tick = async () => {
    let p;
    try { p = await api(`/jobs/${job.job_id}`); } catch (e) { clearInterval(S.poll); showError(e); return; }
    const list = $("steps");
    if (list) list.innerHTML = p.steps.map((s) => `<li class="${s.status}"><span>${esc(s.label)}</span></li>`).join("");
    if (p.status === "processing") return;
    clearInterval(S.poll);
    if (p.status === "failed" || !p.insight_id) { showError(new ApiError(502, p.error || t("failed"))); return; }
    try {
      const [insight, trace] = await Promise.all([api(`/insights/${p.insight_id}`), api(`/insights/${p.insight_id}/trace`)]);
      S.insight = insight; S.trace = trace; renderInsight(insight, trace);
    } catch (e) { showError(e); }
  };
  S.poll = setInterval(tick, 700);
  tick();
}

// ---------------------------------------------------------------- the insight

function legend(counts) {
  const total = counts ? ORIGINS.reduce((n, o) => n + (counts[o] || 0), 0) : 0;
  const bar = counts && total ? `<div class="bar" role="img" aria-label="${esc(ORIGINS.map((o) => `${originLabel(o)}: ${counts[o] || 0}`).join(", "))}">${
    ORIGINS.filter((o) => counts[o]).map((o) => `<span style="width:${(100 * counts[o]) / total}%;background:var(--${o})"></span>`).join("")}</div>` : "";
  const items = ORIGINS.map((o) => `<li><span class="dot" style="background:var(--${o})"></span>${esc(originLabel(o))}${counts ? ` ${counts[o] || 0}` : ""}</li>`).join("");
  return `<div class="spectrum">${bar}<ul class="legend">${items}</ul></div>`;
}
const originLabel = (o) => fill(t("origin")[o], { inst: inst() });

function refs(ids, index) {
  const nums = ids.filter((id) => id in index).map((id) => `<a href="#src-${index[id]}">${index[id]}</a>`);
  return nums.length ? `<span class="refs">[${nums.join(", ")}]</span>` : "";
}

function claimItem(c, index, extra = "") {
  return `<li class="claim" style="--c:var(--${c.origin})"><span class="tag">${esc(originLabel(c.origin))}</span>${esc(c.text)}${refs(c.source_ids, index)}${extra}${
    c.caveat ? `<span class="caveat">${esc(t("caveatLabel"))}: ${esc(c.caveat)}</span>` : ""}</li>`;
}

function renderInsight(ins, trace) {
  const index = Object.fromEntries(ins.sources.map((s, i) => [s.source_id, i + 1]));
  const all = [...ins.what_happened, ...ins.why_it_matters, ...ins.risks, ...ins.opportunities, ...ins.house_view];
  const counts = {}; all.forEach((c) => { counts[c.origin] = (counts[c.origin] || 0) + 1; });
  const B = t("blocks"), names = { inst: inst() };
  const block = (key, items, render) => items.length ? `<div class="block"><h2>${esc(fill(B[key], names))}</h2>${render(items)}</div>` : "";
  const claims = (items) => `<ul class="claims">${items.map((c) => claimItem(c, index)).join("")}</ul>`;
  const effects = (items) => `<ul class="claims">${items.map((e) => claimItem(e, index,
    `<span class="effect">${esc(t("impact"))}: ${esc(t("levels")[e.impact])}, ${esc(t("horizon")[e.horizon] || e.horizon)}${
      e.estimate ? `; ${esc(t("estimate"))}: ${esc([e.estimate.low, e.estimate.high].filter((x) => x != null).join("–"))} ${esc(e.estimate.unit)}` : ""}</span>`)).join("")}</ul>`;
  const kind = (k) => { const w = t("kinds")[k] || k; return w.charAt(0).toUpperCase() + w.slice(1); };
  const actions = (items) => `<ol class="actions">${items.map((a) => `<li>${esc(a.text)}<small>${esc(kind(a.kind))}${
    a.product ? `, ${esc(t("product"))}: ${esc(a.product)}` : ""}. ${esc(t("because"))}: ${esc(a.rationale)}</small></li>`).join("")}</ol>`;
  const scen = (items) => `<ul class="scen">${items.map((s) => `<li><strong>${esc(s.name)}</strong> — ${esc(s.description)} (${esc(t("plausibility"))}: ${esc(t("levels")[s.plausibility] || s.plausibility)})</li>`).join("")}</ul>`;
  const fmt = new Intl.DateTimeFormat(S.lang, { day: "numeric", month: "short", year: "numeric" });
  const sources = `<div class="block"><h2>${esc(B.sources)}</h2><ol class="sources">${ins.sources.map((s, i) => `<li id="src-${i + 1}">${
    s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}${
    [["news", "research"].includes(s.type) ? t("sourceTypes")[s.type] : null, s.publisher, s.published_at ? fmt.format(new Date(s.published_at)) : null, s.page ? `p. ${s.page}` : null].filter(Boolean).map((x) => `, ${esc(x)}`).join("")}</li>`).join("")}</ol></div>`;
  const house = ins.house_view.length ? block("house_view", ins.house_view, claims)
    : `<div class="block"><h2>${esc(fill(B.house_view, names))}</h2><p class="claim" style="--c:var(--rule)">${esc(fill(t("noHouse"), names))}</p></div>`;

  $("sheet").innerHTML = `<article>
    <h1 class="headline">${esc(ins.headline)}</h1>
    <p class="impact">${esc(t("impact"))}: <strong>${esc(t("levels")[ins.overall_impact])}</strong>, ${esc(t("direction")[ins.overall_direction])}</p>
    ${legend(counts)}
    ${block("what_happened", ins.what_happened, claims)}
    ${block("why_it_matters", ins.why_it_matters, claims)}
    ${block("risks", ins.risks, effects)}
    ${block("opportunities", ins.opportunities, effects)}
    ${house}
    ${block("scenarios", ins.scenarios, scen)}
    ${block("actions", ins.actions, actions)}
    ${sources}
    ${ins.disclaimer ? `<p class="disclaimer">${esc(ins.disclaimer)}</p>` : ""}
  </article>
  <div class="chat"><h2>${esc(t("askTitle"))}</h2>
    <form id="ask"><label class="sr" for="q">${esc(t("askTitle"))}</label><input id="q" autocomplete="off" placeholder="${esc(t("askPh"))}" required>
    <button class="btn" type="submit">${esc(t("ask"))}</button></form><div id="turns"></div></div>
  ${traceBlock(trace)}`;
  $("ask").onsubmit = (e) => { e.preventDefault(); ask($("q").value.trim()); };
  document.querySelector(".read").scrollTo?.({ top: 0 });
}

function traceBlock(trace) {
  if (!trace) return "";
  const tt = trace.totals || {};
  const rows = trace.steps.map((s) => `<tr><td>${esc(s.name)}</td><td>${esc(s.model || "")}</td><td class="num">${(s.latency_ms / 1000).toFixed(1)} s</td>
    <td class="v-${esc(s.verdict || "")}">${esc(s.verdict || "")}</td><td>${s.issues.slice(0, 3).map(esc).join("<br>")}</td></tr>`).join("");
  return `<details class="trace"><summary>${esc(t("trace"))}</summary>
    <p class="totals">${esc(fill(t("totals"), { c: tt.llm_calls, k: tt.cached_calls, t: (tt.tokens_in || 0) + (tt.tokens_out || 0), s: ((tt.latency_ms || 0) / 1000).toFixed(1), r: tt.iterations }))}</p>
    <div class="tablewrap"><table><thead><tr><th>${esc(t("step"))}</th><th>${esc(t("model"))}</th><th>${esc(t("time"))}</th><th>${esc(t("verdict"))}</th><th>${esc(t("notes"))}</th></tr></thead>
    <tbody>${rows}</tbody></table></div></details>`;
}

// ---------------------------------------------------------------- follow-up questions

async function ask(question) {
  if (!question || !S.insight) return;
  const form = $("ask"), button = form.querySelector("button");
  button.disabled = true;
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.innerHTML = `<p class="q">${esc(question)}</p><p class="a">…</p>`;
  $("turns").prepend(turn);
  try {
    const r = await api(`/insights/${S.insight.insight_id}/chat`, { method: "POST", body: JSON.stringify({ question, history: S.history }) });
    S.history.push({ role: "user", text: question }, { role: "assistant", text: r.answer });
    const index = Object.fromEntries([...S.insight.sources, ...r.sources].map((s, i, arr) => [s.source_id, arr.findIndex((x) => x.source_id === s.source_id) + 1]));
    turn.innerHTML = `<p class="q">${esc(question)}</p><p class="a">${esc(r.answer)}</p>
      ${r.claims.length ? `<ul class="claims">${r.claims.map((c) => claimItem(c, index)).join("")}</ul>` : ""}
      ${r.follow_ups.length ? `<div class="follow">${r.follow_ups.map((f) => `<button type="button">${esc(f)}</button>`).join("")}</div>` : ""}`;
    turn.querySelectorAll(".follow button").forEach((b) => { b.onclick = () => { $("q").value = b.textContent; $("q").focus(); }; });
    $("q").value = "";
  } catch (e) {
    turn.querySelector(".a").textContent = e.message;
  } finally { button.disabled = false; }
}

// ---------------------------------------------------------------- start

$("subject").onchange = (e) => chooseProfile(e.target.value);
async function switchLang(lang) {
  // the labels switch at once; the feed is fetched again for reasons in the new language; an insight on screen
  // stays in the language it was written in (the next one is written in the new language)
  setLang(lang);
  notice();
  if (!S.profile) return;
  const shown = S.insight, trace = S.trace;
  const feed = await api(`/profiles/${encodeURIComponent(S.profile.profile_id)}/feed?top=30&tag=false&language=${S.lang}`).catch(() => null);
  if (feed) { S.feed = feed.items; renderFeed(); }
  if (shown) renderInsight(shown, trace); else welcome();
}
document.querySelectorAll("[data-lang]").forEach((b) => { b.onclick = () => switchLang(b.dataset.lang); });
$("paste").onsubmit = (e) => { e.preventDefault(); analyze({ news: { title: $("ptitle").value.trim(), text: $("ptext").value.trim(), language: S.lang } }); };

async function start() {
  try {
    S.health = await api("/health");
    S.profiles = await api("/profiles");
  } catch (e) { showError(e); return; }
  setLang(recall("refract.lang") || S.health.language);
  notice();
  renderProfiles();
  await chooseProfile(recall("refract.profile") || (S.profiles[0] && S.profiles[0].profile_id));
}
S.token = recall("refract.token");
setLang(recall("refract.lang") || "ru");
start();
</script>
